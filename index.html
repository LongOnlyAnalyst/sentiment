<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentiment</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:#1a1a1a;background:#fff;overflow-wrap:anywhere}
main{max-width:680px;margin:0 auto;padding:48px 20px 80px}
h1{font-size:17px;font-weight:600;margin:0 0 28px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px;border:1px solid #bbb;border-radius:4px;background:#fff;color:inherit}
button{font:inherit;font-size:16px;padding:12px 16px;min-height:44px;border:1px solid #1a1a1a;border-radius:4px;background:#fff;color:#1a1a1a;cursor:pointer}
.hint,.muted{color:#666}
.hint{margin:12px 0 0}
a{color:#1a1a1a}
.accent{color:#9a3412}
hr{border:0;border-top:1px solid #e3e3e3;margin:28px 0}
h2{font-size:22px;font-weight:600;margin:0}
h3{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#666;margin:0 0 10px}
p{margin:0 0 12px}
ul{padding-left:18px;margin:0 0 12px}li{margin:0 0 8px}
blockquote{margin:0 0 20px;padding:0}
blockquote p{margin:0 0 4px}
#recent a{display:inline-block;padding:10px 14px 10px 0;min-height:44px}
#status{margin:16px 0 0}
</style>
</head>
<body>
<main>
<h1>Sentiment</h1>
<form id="f" autocomplete="off"><input id="q" placeholder="Company or ticker" aria-label="Company or ticker" autocapitalize="characters"><button>Read</button></form>
<p class="hint" id="hint">Type a company to get a read</p>
<p id="status" class="muted" hidden></p>
<div id="recentWrap" hidden><hr><h3>Recent lookups</h3><div id="recent"></div></div>
<div id="read"></div>
</main>
<script>
const FORM_URL="https://formspree.io/f/mvkkbrnl";
const M=["January","February","March","April","May","June","July","August","September","October","November","December"];
let DATA=null,timer=null;
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fd(s){if(!s)return"";const[y,m,d]=s.slice(0,10).split("-").map(Number);return M[m-1]+" "+d+", "+y}
function fdt(iso){const d=new Date(iso);if(isNaN(d))return"";const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",month:"long",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}).formatToParts(d);const g=t=>(p.find(x=>x.type===t)||{}).value;return g("month")+" "+g("day")+", "+g("year")+", "+g("hour")+":"+g("minute")+" "+g("dayPeriod")+" CT"}
function fshort(iso){const d=new Date(iso);return new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",month:"long",day:"numeric"}).format(d)}
const n=v=>v==null?null:Number(v).toLocaleString("en-US");
async function load(){const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});DATA=await r.json();return DATA}
function find(q){q=q.trim().toLowerCase().replace(/^\$/,"");if(!q||!DATA)return null;return DATA.tickers.find(t=>t.symbol.toLowerCase()===q)||DATA.tickers.find(t=>t.company.toLowerCase()===q)||DATA.tickers.find(t=>t.company.toLowerCase().startsWith(q)&&q.length>=3)}
function recent(){try{return JSON.parse(localStorage.getItem("recent")||"[]")}catch(e){return[]}}
function addRecent(s){const r=recent().filter(x=>x!==s);r.unshift(s);localStorage.setItem("recent",JSON.stringify(r.slice(0,12)));drawRecent()}
function drawRecent(){const r=recent();document.getElementById("recentWrap").hidden=!r.length;document.getElementById("recent").innerHTML=r.map(s=>`<a href="#${esc(s)}" data-s="${esc(s)}">${esc(s)}</a>`).join(" ")}
function status(t){const e=document.getElementById("status");e.hidden=!t;e.innerHTML=t||""}
function overview(o){if(!o)return"";if(Array.isArray(o))return`<ul>${o.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;let h="";
if(o.lean)h+=`<p><b>Lean:</b> ${esc(o.lean)}</p>`;
if(o.camps&&o.camps.length)h+=`<ul>${o.camps.map(c=>`<li><b>${esc(c.name)}:</b> ${esc(c.argues)}</li>`).join("")}</ul>`;
if(o.agree)h+=`<p><b>Where they agree:</b> ${esc(o.agree)}</p>`;
if(o.split)h+=`<p><b>Where they split:</b> ${esc(o.split)}</p>`;
if(o.shift&&o.shift.length)h+=`<p><b>How it shifted:</b></p><ul>${o.shift.map(s=>`<li>${esc(fd(s.date))}: ${esc(s.note)}</li>`).join("")}</ul>`;
if(o.hinges)h+=`<p><b>What it hinges on:</b> ${esc(o.hinges)}</p>`;return h}
function render(t){const days=(Date.now()-new Date(t.updatedAt))/864e5;
const stale=days>3?` <span class="accent">Stale, last updated ${esc(fshort(t.updatedAt))}</span>`:"";
const posts=(t.posts||[]).slice().sort((a,b)=>(b.views||0)-(a.views||0)||(b.likes||0)-(a.likes||0));
const dr=t.driver||{};
document.getElementById("read").innerHTML=`<hr>
<h2>${esc(t.company)} (${esc(t.symbol)})</h2>
<p class="muted">As of ${esc(fdt(t.updatedAt))}.${stale}</p>
<p>${esc(t.verdict||t.sentimentLabel)}</p>
<p class="muted">Move: ${esc(t.move)}</p>
<hr><h3>Overall picture</h3>${overview(t.overview)}
<hr><h3>What happened</h3><p><b>${esc(dr.type)}, ${esc(fd(dr.date))}:</b> ${esc(dr.title)}</p><p>${esc(t.whatHappened)}</p>
${(t.facts||[]).length?`<ul>${t.facts.map(f=>`<li>${esc(f.label)}: ${esc(f.value)}</li>`).join("")}</ul>`:""}
<hr><h3>How investors are reading it</h3><p>${esc(t.howReading)}</p>${t.controversy?`<p class="muted">Contested: ${esc(t.controversy)}</p>`:""}
<hr><h3>Top posts</h3>${posts.map(p=>`<blockquote><p>"${esc(p.excerpt||p.gist)}"</p><p class="muted">${esc(p.author)}, ${esc(fdt(p.date))}. ${p.views==null?"views n/a":n(p.views)+" views"}, ${n(p.likes)} likes, ${n(p.reposts)} reposts. <a href="${esc(p.url)}" target="_blank" rel="noopener">Open on X</a></p></blockquote>`).join("")}
${t.changed?`<p class="muted">Changed since last read: ${esc(t.changed)}</p>`:""}
<hr><button id="refresh">Refresh this read</button>`;
document.getElementById("refresh").onclick=()=>request(t.symbol,true)}
function open(t){stop();status("");render(t);addRecent(t.symbol);location.hash=t.symbol}
function stop(){if(timer){clearInterval(timer);timer=null}}
async function request(q,isRefresh){const sym=q.trim().replace(/^\$/,"").toUpperCase();const since=Date.now();
const subj=(isRefresh?"Sentiment refresh: ":"Sentiment request: ")+sym;
try{const r=await fetch(FORM_URL,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({_subject:subj,message:sym,request:sym})});if(!r.ok)throw 0}catch(e){status("Could not send the request. Try again.");return}
if(!isRefresh)document.getElementById("read").innerHTML="";
status("Searching, this takes a few minutes");stop();
timer=setInterval(async()=>{if(Date.now()-since>15*60e3){stop();status("No read yet after 15 minutes. Try again later.");return}
try{await load();const t=find(sym);if(t&&new Date(t.updatedAt).getTime()>since){stop();addRecent(t.symbol);status(`<a href="#${esc(t.symbol)}" id="ready">Ready, tap to refresh</a>`);document.getElementById("ready").onclick=e=>{e.preventDefault();open(t)}}}catch(e){}},20000)}
document.getElementById("f").onsubmit=e=>{e.preventDefault();const q=document.getElementById("q").value;if(!q.trim())return;const t=find(q);t?open(t):request(q,false)};
document.getElementById("recent").onclick=e=>{const s=e.target.dataset&&e.target.dataset.s;if(!s)return;e.preventDefault();const t=find(s);if(t)open(t);else status("No read for "+esc(s)+" yet.")};
load().then(()=>{drawRecent();const h=decodeURIComponent(location.hash.slice(1));if(h&&recent().includes(h.toUpperCase())){const t=find(h);if(t)render(t)}});
</script>
</body>
</html>
